name: publish

# Publishes to PyPI using the PYPI_API_TOKEN repository secret.
#
# To move to Trusted Publishing later (no stored token at all): register this workflow at
# https://pypi.org/manage/project/fanbase/settings/publishing/ with owner
# fandango-fuzzer, repository fanbase-cli, workflow publish.yml, environment pypi — then
# drop the `with:` block below and add `permissions: id-token: write` to this job.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*

      # The tag must match the version in pyproject.toml, or a release publishes
      # something other than what the tag claims.
      - name: Tag matches package version
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $tag does not match pyproject version $version"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fanbase
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
