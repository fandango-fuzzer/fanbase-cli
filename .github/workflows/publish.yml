name: publish

# A release of fanbase: push a tag `vX.Y.Z` (RELEASING.md). It is made in this order, and each step runs only if the one before
# it passed:
#
#   1. tests    tests.yml: Linux, macOS and Windows, two Pythons, and the type check;
#   2. build    the package, from a commit that is on main and whose version is the tag's;
#   3. publish  PyPI, using the PYPI_API_TOKEN repository secret;
#   4. release  the GitHub release, with the files of the package attached, and the message of the tag as its notes.
#
# The GitHub release is last because the Zenodo integration of this repository archives a release under a DOI that is
# permanent, the moment it is published. (Do not make a release by hand first: that is what a tag push is for, and it would
# archive a version that has not been tested or is not on PyPI.)
#
# A run started by hand does steps 1 and 2 and stops: to try a change to this file.
#
# To move to Trusted Publishing later (no stored token at all): register this workflow at
# https://pypi.org/manage/project/fanbase/settings/publishing/ with owner
# fandango-fuzzer, repository fanbase-cli, workflow publish.yml, environment pypi — then
# drop the `with:` block below and add `permissions: id-token: write` to the publish job.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A release is made from main, not from a branch that is still being worked on.
      - name: The tagged commit is on main
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the tagged commit is not on main"
            exit 1
          fi

      # The tag must match the version in pyproject.toml, or a release publishes
      # something other than what the tag claims.
      - name: Tag matches package version
        if: github.event_name == 'push'
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $tag does not match pyproject version $version"
            exit 1
          fi

      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*

      # The notes of the release are the message of the (annotated) tag. A lightweight tag has none, and the release gets
      # notes made from the pull requests instead.
      - name: The message of the tag
        if: github.event_name == 'push'
        run: |
          git fetch --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if [ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = "tag" ]; then
            git for-each-ref --format='%(contents)' "refs/tags/${GITHUB_REF_NAME}" > notes.md
          fi
          touch notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            notes.md
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fanbase
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: .

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  release:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: .

      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -s notes.md ]; then
            notes=(--notes-file notes.md)
          else
            notes=(--generate-notes)
          fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "fanbase ${TAG#v}" --verify-tag "${notes[@]}"
