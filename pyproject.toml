[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fanbase"
version = "0.6.0"
description = "Client for the Fanbase registry of Fandango input specifications"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "José Antonio Zamudio Amaya" }]
keywords = ["fandango", "fuzzing", "test generation", "grammars", "file formats", "registry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
# pyyaml: the registry's metadata.yml and index.yml files. packaging: the version range a spec
# names for Fandango.
dependencies = ["pyyaml>=6", "packaging>=23"]

[project.urls]
Homepage = "https://github.com/fandango-fuzzer/fanbase"
Repository = "https://github.com/fandango-fuzzer/fanbase-cli"
Issues = "https://github.com/fandango-fuzzer/fanbase-cli/issues"
Fandango = "https://fandango-fuzzer.github.io/"

[project.scripts]
fanbase = "fanbase.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fanbase"]
